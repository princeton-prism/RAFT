[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raft"
version = "1.0.0"
description = "RAFT: reasoning-aligned two-stage post-training for MolmoBot-Pi0 (built on allenai/MolmoBot MolmoBot-Pi0)"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "h5py",
    "numpy==1.24",
    "pyyaml",
    "wandb",
    "tqdm",
    "torch>=2.7.0,<2.9.0",
    "hydra-core",
    "pydantic",
    "decord; sys_platform == 'linux'", # For Linux
    "eva-decord; sys_platform == 'darwin'", # For macOS
    "pillow",
    "openpi @ git+https://github.com/Physical-Intelligence/openpi.git@54cbaee6ae0c010a1ed431871cdaa8f4684ac709#egg=openpi",
    "transformers==4.53.2",
    "pytest",
    "chex",
    "huggingface_hub",
    "peft",                  # Stage I LoRA training + merge
]
[project.optional-dependencies]
eval = [
    # allenai/molmospaces@cd23bec (git submodule) + scripts/molmospaces_raft.patch, applied by
    # scripts/setup_molmospaces.sh (see [tool.uv.sources]).
    "molmo-spaces[mujoco]",
    "msgpack>=1.0.6",
    "msgpack-numpy",
    "websockets",
    "boto3",
    "types-boto3",
    "types-boto3-s3",
    "python-dotenv",
    "scipy",
]

[tool.uv.sources]
molmo-spaces = { path = "molmospaces", editable = true }

[tool.uv]
# Exact versions of the tested environment.
